<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EduBreakout – Sicherheit im Fachraum</title>
<style>
:root{
  --bg:#0d1726; --bg2:#13233a; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16); --ink:#eef3fa; --mut:#a9b7cc;
  --gr:#1fa65a; --gr2:#5fe39a; --rd:#e0302a; --ye:#ffcc00; --bl:#4aa8ff; --or:#ff8a1f;
  --lock:#ffcc00; --r:18px; --fs:17px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:32px 32px;}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit}
a{color:var(--bl)}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--ye) 0 16px,#111 16px 32px)}
header.top{position:sticky;top:0;z-index:20;background:rgba(13,23,38,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.brand small{font-weight:500;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.9rem;white-space:nowrap}
.ibtn{min-width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.ibtn[aria-pressed=false]{opacity:.5}
main{max-width:1100px;margin:0 auto;padding:18px 14px 90px}
h1{font-size:1.9rem;margin:.2em 0 .3em;line-height:1.15}
h2{font-size:1.35rem;margin:.2em 0 .5em}
h3{font-size:1.1rem;margin:.6em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.mut{color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:650}
.btn.pri{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.warn{background:var(--ye);border-color:var(--ye);color:#111}
.btn.red{background:var(--rd);border-color:var(--rd);color:#fff}
.btn.small{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active{transform:scale(.98)}
.inp{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}
.inp:focus{outline:2px solid var(--bl)}
.disc{font-size:.85rem;color:var(--mut);border-left:4px solid var(--ye);padding:8px 12px;background:rgba(255,204,0,.06);border-radius:8px}
/* Story */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center}
.hero .box{width:100%;max-width:260px;margin:auto;position:relative}
.hero .box svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 30px rgba(255,204,0,.35))}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .box{max-width:200px}}
/* Lock picker */
.locks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:560px){.locks{grid-template-columns:repeat(3,1fr)}}
.lockbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.9rem}
.lockbtn[aria-pressed=true]{border-color:var(--ye);background:rgba(255,204,0,.12);box-shadow:0 0 0 3px rgba(255,204,0,.25)}
.lockbtn svg{width:54px;height:62px}
/* Hub */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:190px}
.tile img{width:78px;height:78px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}
.tile .tt{font-weight:700;font-size:1.02rem;line-height:1.2}
.tile .st{font-size:.85rem;color:var(--mut);margin-top:auto}
.tile.solved{border-color:var(--gr);background:rgba(31,166,90,.14)}
.tile .badge{position:absolute;top:12px;right:12px;min-width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;background:rgba(0,0,0,.3);border:1px dashed var(--line)}
.tile.solved .badge{background:var(--gr);border:0;color:#fff}
.prog{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--gr2));transition:width .6s}
/* Station */
.sthead{display:flex;gap:16px;align-items:center}
.sthead img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:14px;padding:5px;flex:none}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.steps button{border-radius:999px;padding:8px 14px;background:var(--card);border:1px solid var(--line);font-weight:600;min-height:44px}
.steps button[aria-current=true]{background:var(--ye);color:#111;border-color:var(--ye)}
.steps button.ok::after{content:" ✓";color:var(--gr2)}
.steps button[aria-current=true].ok::after{color:#0a6}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rules li{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rules li b{display:block}
.rules li .why{font-size:.92rem;color:var(--mut);margin-top:4px}
.rules li .why::before{content:"Warum? ";font-weight:700;color:var(--ye)}
.merk{border:2px solid var(--gr);background:rgba(31,166,90,.12);border-radius:14px;padding:12px 14px;margin-top:12px}
.merk::before{content:"💡 Merksatz";display:block;font-weight:800;color:var(--gr2);margin-bottom:4px}
.alltag{border:2px dashed var(--bl);border-radius:14px;padding:12px 14px;margin-top:12px;background:rgba(74,168,255,.08)}
.alltag::before{content:"🏠 Wie im Alltag";display:block;font-weight:800;color:var(--bl);margin-bottom:4px}
.local{border:2px solid var(--or);border-radius:14px;padding:12px 14px;margin-top:12px;background:rgba(255,138,31,.1)}
.local::before{content:"📍 Bei uns im Fachraum";display:block;font-weight:800;color:var(--or);margin-bottom:4px}
.frame{width:100%;height:72vh;min-height:520px;border:0;border-radius:14px;background:#fff}
.framewrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:260px;text-align:center;padding:20px;background:rgba(0,0,0,.2);border-radius:14px;border:1px dashed var(--line)}
/* Code pad */
.codebox{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.codebox{grid-template-columns:1fr}}
.display{height:84px;border-radius:16px;background:#071018;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:800 2.6rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;color:var(--ye)}
.display.ok{border-color:var(--gr);color:var(--gr2)}
.display.bad{border-color:var(--rd);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pad button{height:62px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:1.5rem;font-weight:700}
.pad button.go{background:var(--gr);border-color:var(--gr)}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(31,166,90,.18);border:1px solid var(--gr)}
.fb.bad{background:rgba(224,48,42,.15);border:1px solid var(--rd)}
.tip{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(255,204,0,.07)}
.tip b{color:var(--ye)}
/* Check widget */
.chk{display:grid;gap:10px}
.chk .it{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.15)}
.chk .it .q{font-weight:600}
.chk .it .ab{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chk .it .ab button{min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:650}
.chk .it.ok{border-color:var(--gr)}
.chk .it.no{border-color:var(--rd)}
.chk .it .ex{font-size:.92rem;margin-top:8px;display:none}
.chk .it.ok .ex,.chk .it.no .ex{display:block}
/* Order widget */
.ord{display:grid;gap:8px}
.ord button{text-align:left;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;gap:10px;align-items:center}
.ord button .n{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);font-weight:800}
.ord button.set{border-color:var(--gr);background:rgba(31,166,90,.15)}
.ord button.set .n{background:var(--gr)}
.ord button.wrong{border-color:var(--rd)}
/* GHS cards */
.ghs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.flip{perspective:900px;height:230px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .ba{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line)}
.flip .fa{background:#fff;color:#111}
.flip .fa img{width:110px;height:110px}
.flip .fa b{font-size:.85rem;text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.flip .ba{background:#1b2c44;transform:rotateY(180deg);font-size:.8rem;text-align:left;justify-content:flex-start;align-items:stretch;overflow:auto}
.flip .ba b{color:var(--ye)}
/* QR */
.qrwrap{display:grid;grid-template-columns:1fr;gap:14px;max-width:640px;margin:auto}
.qr{background:#fff;border-radius:14px;padding:12px;max-width:640px;width:100%;margin:auto;position:relative;overflow:hidden}
.qr svg{display:block;width:100%;height:auto;touch-action:manipulation}
.qr .cell{cursor:pointer}
.scanline{position:absolute;left:0;right:0;height:4px;background:rgba(31,166,90,.9);box-shadow:0 0 18px 6px rgba(31,166,90,.6);top:0;display:none}
.scanning .scanline{display:block;animation:scan 1.4s linear}
@keyframes scan{from{top:0}to{top:100%}}
.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.letters button{height:58px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:1.4rem;font-weight:800}
.letters button.on{background:#111;border-color:var(--ye);color:var(--ye)}
/* Calc */
.calc{display:grid;gap:14px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:16px;padding:12px}
.crow .lab{font-weight:800;min-width:76px}
.term{display:flex;flex-direction:column;align-items:center;gap:2px}
.term img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.term small{font-weight:800;color:var(--ye)}
.op{font-size:1.6rem;font-weight:800;width:22px;text-align:center}
.crow input{width:86px;height:58px;text-align:center;font-size:1.6rem;font-weight:800;border-radius:12px;border:2px solid var(--line);background:#071018;color:var(--ye)}
.crow.ok{border-color:var(--gr)}
.crow.ok input{border-color:var(--gr);color:var(--gr2)}
.crow.no input{border-color:var(--rd)}
.bigcode{font:800 4.2rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;text-align:center;color:var(--ye);text-shadow:0 0 24px rgba(255,204,0,.4);margin:8px 0}
/* Tresor */
.vault{width:min(340px,80vw);aspect-ratio:1/1;margin:20px auto;position:relative;perspective:1000px}
.vault .door{position:absolute;inset:0;border-radius:24px;background:radial-gradient(circle at 50% 50%,#8d99ab,#4b5668 70%);border:8px solid #2a3240;transform-origin:left center;transition:transform 1.8s cubic-bezier(.5,.1,.3,1);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:2}
.vault .wheel{width:46%;aspect-ratio:1/1;border-radius:50%;border:10px solid #2a3240;background:conic-gradient(#c7cfdb 0 10%,#6b7688 10% 20%,#c7cfdb 20% 30%,#6b7688 30% 40%,#c7cfdb 40% 50%,#6b7688 50% 60%,#c7cfdb 60% 70%,#6b7688 70% 80%,#c7cfdb 80% 90%,#6b7688 90%);transition:transform 1.2s}
.vault.open .door{transform:rotateY(-105deg)}
.vault.open .wheel{transform:rotate(540deg)}
.vault .inside{position:absolute;inset:8px;border-radius:18px;background:#0a121e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;font-weight:800;color:var(--ye)}
.vault .inside .doc{font-size:4.5rem}
/* Confirm */
.mem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);margin:8px 0;min-height:60px;width:100%;text-align:left}
.mem .box{flex:none;width:34px;height:34px;border-radius:8px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800}
.mem[aria-pressed=true]{border-color:var(--gr);background:rgba(31,166,90,.14)}
.mem[aria-pressed=true] .box{background:var(--gr);border-color:var(--gr)}
/* Table */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tbl-wrap{overflow-x:auto}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;border:1px solid rgba(255,255,255,.5);margin-right:4px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px}
footer button{background:none;border:0;color:var(--mut);text-decoration:underline;min-height:44px}
.teacherbar{background:var(--or);color:#111;font-weight:700;text-align:center;padding:8px 12px}
.sol{display:inline-block;background:var(--or);color:#111;font-weight:800;border-radius:8px;padding:2px 10px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2c44;border:1px solid var(--line);padding:12px 20px;border-radius:14px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.fade{animation:fade .35s ease}
@keyframes fade{from{transform:translateY(8px)}to{transform:none}}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,204,0,0)}0%{box-shadow:0 0 0 0 rgba(255,204,0,.5)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{header,footer,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff}}
</style>
</head>
<body>
<div id="tbar"></div>
<header class="top">
  <div class="stripe"></div>
  <div class="bar">
    <div class="brand">🧪 EduBreakout <small>Sicherheit im Fachraum</small></div>
    <span class="chip" id="hTeam" hidden></span>
    <span class="chip" id="hTime" title="Bearbeitungszeit inklusive Strafminuten">⏱ 00:00</span>
    <button class="ibtn" id="bHome" title="Stationskarte" aria-label="Stationskarte">🗺️</button>
    <button class="ibtn" id="bSound" title="Ton an/aus" aria-label="Ton an oder aus" aria-pressed="true">🔊</button>
    <button class="ibtn" id="bFont" title="Schriftgröße" aria-label="Schriftgröße ändern">🔠</button>
  </div>
</header>
<main id="app"></main>
<footer class="noprint">
  EduBreakout „Sicherheit im Fachraum“ · Idee und Rätsel: Felix Schell · digitale Version <span id="ver"></span><br>
  <button id="bTeacher">Lehrkraft-Bereich</button>
</footer>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* ================= KONFIGURATION ================= */
const TEACHER = false;
const KEY = "eduBreakoutFachraum_v1_1";
const VER = "1.1";

/* Not-Aus: Aussagen + QR-Code ausmalen */
function tQR(s,t,b){
  t.qr=t.qr||{}; t.ans=t.ans||{};
  b.innerHTML=`<div class="card"><h2>Teil 1 · Welche Aussagen stimmen?</h2>
   <p>Falls ihr unsicher seid, dürft ihr nach Erlaubnis der Lehrkraft den Not-Aus-Schalter betätigen und einzelne Aussagen damit überprüfen.</p>
   <div class="chk" id="stm">${s.stm.map(x=>`<div class="it" data-l="${x[0]}"><div class="q"><b style="color:var(--ye)">${x[0]}</b> · ${esc(x[1])}</div><div class="ab"><button data-a="1">👍 stimmt</button><button data-a="0">👎 stimmt nicht</button></div><div class="ex"></div></div>`).join("")}</div></div>
   <div class="card"><h2>Teil 2 · Malt den QR-Code aus</h2>
   <p>Malt alle Felder der <b>richtigen</b> Buchstaben schwarz aus. Tippt dazu rechts auf einen Buchstaben – oder auf einzelne Felder im Code. Dann tippt auf <b>📷 Scannen</b>.</p>
   <div class="qrwrap"><div class="qr" id="qr"><div class="scanline"></div></div>
    <div><div class="letters" id="lets">${"ABCDEF".split("").map(l=>`<button data-l="${l}">${l}</button>`).join("")}</div>
     <div class="row" style="margin-top:12px"><button class="btn pri" id="bScan" style="flex:1">📷 Scannen</button><button class="btn small" id="bClr">↺ leeren</button></div>
     <div class="fb" id="qfb"></div>
     <p class="mut" style="font-size:.85rem">Profi-Tipp: Der fertige Code ist ein echter QR-Code – ihr könnt ihn auch mit dem iPad eines anderen Teams scannen.</p></div></div></div>`;
  const stm=$("#stm");
  const showAns=(it,x,a)=>{const ok=(a==="1")===x[2];it.className="it "+(ok?"ok":"no");it.querySelector(".ex").textContent=(ok?"✔ Richtig erkannt. ":"✘ Denkt noch einmal nach. ")+x[3]};
  s.stm.forEach(x=>{if(t.ans[x[0]]!==undefined)showAns(stm.querySelector(`[data-l="${x[0]}"]`),x,t.ans[x[0]])});
  stm.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const it=a.closest(".it"),x=s.stm.find(y=>y[0]===it.dataset.l);t.ans[x[0]]=a.dataset.a;save();showAns(it,x,a.dataset.a);beep((a.dataset.a==="1")===x[2]?"ok":"bad")};
  const N=QR.m.length, Q=2, Z=N+2*Q;
  const key=(r,c)=>r+"_"+c;
  const isL=(r,c)=>r>=8&&r<=16&&c>=8&&c<=16;
  const drawQR=()=>{let h=`<svg viewBox="0 0 ${Z} ${Z}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${Z}" height="${Z}" fill="#fff"/>`;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(isL(r,c)){const L=QR.g[r-8][c-8],on=!!t.qr[key(r,c)];
        h+=`<g class="cell" data-rc="${r},${c}"><rect x="${c+Q}" y="${r+Q}" width="1" height="1" fill="${on?"#000":"#fff"}" stroke="#ccc" stroke-width=".04"/>${on?"":`<text x="${c+Q+.5}" y="${r+Q+.72}" font-size=".62" text-anchor="middle" font-family="Arial" fill="#333">${L}</text>`}</g>`}
      else if(QR.m[r][c]==="1")h+=`<rect x="${c+Q}" y="${r+Q}" width="1.02" height="1.02" fill="#000"/>`;}
    $("#qr").querySelector("svg")?.remove();$("#qr").insertAdjacentHTML("beforeend",h+"</svg>");
    document.querySelectorAll("#lets button").forEach(bt=>{const L=bt.dataset.l;let all=true,any=false;
      for(let r=8;r<=16;r++)for(let c=8;c<=16;c++)if(QR.g[r-8][c-8]===L){if(t.qr[key(r,c)])any=true;else all=false}
      bt.classList.toggle("on",all&&any)});};
  drawQR();
  $("#qr").onclick=e=>{const g=e.target.closest("[data-rc]");if(!g)return;const[r,c]=g.dataset.rc.split(",").map(Number);t.qr[key(r,c)]=!t.qr[key(r,c)];save();beep("tap");drawQR()};
  $("#lets").onclick=e=>{const bt=e.target.closest("[data-l]");if(!bt)return;const L=bt.dataset.l,on=!bt.classList.contains("on");
    for(let r=8;r<=16;r++)for(let c=8;c<=16;c++)if(QR.g[r-8][c-8]===L)t.qr[key(r,c)]=on;save();beep("tap");drawQR()};
  $("#bClr").onclick=()=>{t.qr={};save();drawQR()};
  $("#bScan").onclick=()=>{const q=$("#qr"),fb=$("#qfb");q.classList.remove("scanning");void q.offsetWidth;q.classList.add("scanning");fb.className="fb";
    let ok=true;for(let r=8;r<=16;r++)for(let c=8;c<=16;c++){const want="ACD".includes(QR.g[r-8][c-8]);if(!!t.qr[key(r,c)]!==want)ok=false}
    setTimeout(()=>{q.classList.remove("scanning");
      if(ok){fb.className="fb show ok";fb.innerHTML="📱 QR-Code erkannt: <b>„Der Lösungscode lautet: 5“</b><br>Tippt jetzt oben auf 🔐 Code.";beep("ok");t.scanned=1;save()}
      else{fb.className="fb show bad";fb.textContent="📵 Kein QR-Code erkannt. Prüft, ob genau die Felder der richtigen Aussagen ausgemalt sind – nicht mehr und nicht weniger.";beep("bad")}},matchMedia("(prefers-reduced-motion: reduce)").matches?50:1400)};
}
function tCode(s,t){

  b.innerHTML=`<div class="card"><h2>Code eingeben</h2>

   </div></div></div>`;
  const drawTips=()=>{let h="";for(let i=0;i<2;i++){h+=i<t.tips?`<div class="tip"><b>Tipp ${i+1}:</b> ${esc(s.tips[i])}</div>`:(i===t.tips?`<button class="btn small warn" id="bTip" style="margin-top:8px">💡 Tipp ${i+1} anzeigen (+1 min)</button>`:"")}

  drawTips();

    if(n==="C")val=val.slice(0,-1);else if(n==="OK"){check();return}else if(val.length<3)val+=n;
    disp.className="display";disp.textContent=val||"_"};
  const check=()=>{if(!val){fb.className="fb show bad";fb.textContent="Tippt zuerst eine Ziffer ein.";return}
    if(val===s.code){t.solved=true;t.at=Date.now();save();beep("ok");confetti();
      const done=solvedN()===7;toast(done?"🎉 Alle 7 Codes gefunden! Jetzt geht's ans Schloss.":"✅ Station gelöst!");tCode(s,t);vStationTabs();
      if(done)setTimeout(()=>go("hub"),1800);}
    else{t.wrong++;save();beep("bad");disp.className="display bad";
      fb.className="fb show bad";fb.textContent=(s.hint&&s.hint[val])||["Dieser Code stimmt noch nicht. Schaut euch das Ergebnis des Rätsels noch einmal genau an.","Leider falsch. Habt ihr die Anweisung am Ende des Rätsels genau befolgt?","Immer noch nicht. Ein Tipp rechts kann euch weiterhelfen."][Math.min(t.wrong-1,2)];val=""}};
}

/* ---------- Prüfcode ---------- */
const B32="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function hash(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0}
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g," ");
function doy(d){const s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/864e5)}
function makeCode(){
  const ci=COLORS.findIndex(c=>c.k===S.color),min=Math.min(511,Math.round(totalMs()/60000)),tips=Math.min(15,tipsN()),wr=Math.min(63,wrongN()),day=doy(new Date(S.finished||Date.now()));
  // 2+4+9+4+6+9+1+1 = 36 Bit
  let p=1;p=p*16+ci;p=p*512+min;p=p*16+tips;p=p*64+wr;p=p*512+day;p=p*2+(S.demo?1:0);p=p*2+(S.done?1:0);
  const mask=hash(norm(S.team)+"|"+SALT)%68719476736, x=xor36(p,mask), chk=hash(x+"|"+norm(S.team)+"|"+SALT)&4095;
  let v=x*4096+chk,out="";for(let i=0;i<10;i++){out=B32[v%32]+out;v=Math.floor(v/32)}
  return out.slice(0,5)+"-"+out.slice(5);
}
function xor36(a,b){const ah=Math.floor(a/65536),al=a%65536,bh=Math.floor(b/65536),bl=b%65536;return ((ah^bh)>>>0)*65536+((al^bl)>>>0)}
function readCode(code,team){
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length!==10)return null;
  let v=0;for(const ch of code){const i=B32.indexOf(ch);if(i<0)return null;v=v*32+i}
  const chk=v%4096,x=Math.floor(v/4096);if((hash(x+"|"+norm(team)+"|"+SALT)&4095)!==chk)return null;
  let p=xor36(x,hash(norm(team)+"|"+SALT)%68719476736);
  const take=n=>{const r=p%n;p=Math.floor(p/n);return r};
  const done=take(2),demo=take(2),day=take(512),wr=take(64),tips=take(16),min=take(512),ci=take(16),ver=take(4);
  return {ver,color:COLORS[ci]?.k,min,tips,wr,day,demo,done};
}

  $("#bReset").onclick=()=>{if(!confirm("Alle Daten dieser Gruppe löschen und neu starten?"))return;store.del(KEY);S=fresh();teacherOK=TEACHER;render()};

    ST.forEach(s=>stS(s.id).solved=true);S.demo=true;save();toast("Alle Stationen gelöst (DEMO).");S.view="hub";render()};
